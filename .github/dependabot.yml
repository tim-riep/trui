# Weekly updates of the development dependencies and the actions.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Updated by hand together with the image of the visual tests and new baselines.
      - dependency-name: playwright
      - dependency-name: "@playwright/test"
      # TypeDoc and API Extractor need the compiler API of TypeScript 6; major
      # updates wait until they support a newer version.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      storybook:
        patterns: ["storybook", "@storybook/*"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
