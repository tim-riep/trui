<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TRUI</title>
    <link rel="stylesheet" href="./trui.css" />
    <script type="importmap">
      {
        "imports": {
          "react": "./vendor/react.js",
          "react-dom": "./vendor/react-dom.js",
          "react-dom/client": "./vendor/react-dom-client.js",
          "react/jsx-runtime": "./vendor/react-jsx-runtime.js",
          "@tim-riep/trui": "./trui.js",
          "@tim-riep/trui/core": "./core.js",
          "@tim-riep/trui/icons": "./icons.js"
        }
      }
    </script>
    <style>
      body {
        margin: 0;
        background: var(--trui-color-background);
      }
      .demo {
        display: flex;
        flex-direction: column;
        gap: var(--trui-space-l);
        box-sizing: border-box;
        min-height: 100vh;
        padding: var(--trui-space-xl);
        background: var(--trui-color-background);
      }
      .demo > * {
        max-width: 480px;
      }
      .demo-row {
        display: flex;
        flex-wrap: wrap;
        gap: var(--trui-space-s);
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { Button, Label, Text, TextField, TruiProvider } from '@tim-riep/trui';
      import { addIcon, editIcon, searchIcon } from '@tim-riep/trui/icons';
      import { createElement as h, useState } from 'react';
      import { createRoot } from 'react-dom/client';

      function Demo() {
        const [theme, setTheme] = useState('light');
        const [locale, setLocale] = useState('en');
        const [name, setName] = useState('Acme Corp');
        return h(
          TruiProvider,
          { theme, locale, className: 'demo' },
          h(Text, { as: 'p', size: 'l', weight: 'semibold' }, 'TRUI served by go-runtime'),
          h(
            'div',
            { className: 'demo-row' },
            h(Button, { variant: 'primary', icon: addIcon }, 'Create'),
            h(Button, { icon: editIcon }, 'Edit'),
            h(Button, { onClick: () => setTheme(theme === 'light' ? 'dark' : 'light') }, `Theme: ${theme}`),
            h(Button, { onClick: () => setLocale(locale === 'en' ? 'de' : 'en') }, `Language: ${locale}`),
          ),
          h(Label, { htmlFor: 'name', required: true }, 'Supplier'),
          h(TextField, {
            id: 'name',
            value: name,
            onChange: setName,
            required: true,
            startContent: h('span', { 'aria-hidden': true }, '#'),
            valueState: name === '' ? 'error' : 'none',
            valueStateMessage: 'Enter a supplier',
          }),
          h(TextField, { 'aria-label': 'Search', type: 'search', placeholder: 'Search' }),
          h(Text, { tone: 'secondary', 'data-testid': 'echo' }, `Supplier: ${name}`),
        );
      }

      createRoot(document.getElementById('root')).render(h(Demo));
    </script>
  </body>
</html>
